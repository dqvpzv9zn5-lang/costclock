<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CostClock — Free Process Cost Calculator | Workthru</title>
  <meta name="description" content="Map any business process step by step and see the true fully-loaded cost. Free process cost calculator for accounting firms, legal practices, and SMEs. By Workthru.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 16px;
      scroll-behavior: smooth;
      /* Suppress pull-to-refresh on mobile browsers without blocking horizontal
         scroll-snap gestures on child elements (those use touch-action: pan-x) */
      overscroll-behavior-y: contain;
    }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #efefef;
      color: #1a1f2e;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }
    #root { min-height: 100vh; }
    @media (max-width: 900px) {
      .template-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
    }
    @media (max-width: 580px) {
      .template-grid { grid-template-columns: 1fr !important; }
    }
    .badge-short { display: none; }
    @media (max-width: 480px) {
      .badge-full { display: none; }
      .badge-short { display: inline; }
      .template-grid { grid-template-columns: 1fr !important; }
    }
    /* Responsive page padding */
    @media (max-width: 600px) {
      .page-pad { padding-left: 16px !important; padding-right: 16px !important; }
    }
    /* Hide scrollbar on horizontal step row */
    .step-scroll-row::-webkit-scrollbar { display: none; }
    /* Allow horizontal pan gestures on scroll-snap rows without interfering
       with the page's vertical scroll or pull-to-refresh suppression */
    .step-scroll-row { touch-action: pan-x; }
    /* Editable field affordance — hover/focus reveals input styling */
    .editable-field {
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      transition: background 0.15s ease, border-color 0.15s ease, padding 0.15s ease;
      padding: 2px 4px;
      margin: -2px -4px;
      outline: none;
    }
    .editable-field:hover, .editable-field:focus {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      padding: 2px 4px;
    }
    /* On dark backgrounds (hero panel) — same as above, already white-tinted */
    /* On light backgrounds (role cards) — use a light-mode tint */
    .editable-field-light {
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
      padding: 2px 4px;
      margin: -2px -4px;
      outline: none;
    }
    .editable-field-light:hover, .editable-field-light:focus {
      background: rgba(0,0,0,0.05);
      border-color: #d1d5db;
    }
    /* Touch devices: show only a very faint hint — not a highlighted/selected look */
    @media (hover: none) {
      .editable-field {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.09);
        padding: 2px 4px;
      }
      .editable-field-light {
        background: rgba(0,0,0,0.02);
        border-color: rgba(0,0,0,0.06);
        padding: 2px 4px;
      }
    }
    /* Two-panel row: stack vertically on narrow screens */
    .panel-row { display: flex; gap: 12px; align-items: flex-start; }
    @media (max-width: 600px) {
      .panel-row { flex-direction: column; }
    }
    /* Safe-area / bottom-bar clearance on mobile.
       The fixed action bar is ~56px; add extra for iOS home indicator. */
    .build-content-pad {
      padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Fixed bottom bar: respect iOS home indicator */
    .bottom-action-bar {
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    /* Fixed nav: add top safe area (notch/Dynamic Island) */
    .app-nav {
      padding-top: env(safe-area-inset-top, 0px);
    }
    /* BuildScreen outer: clear fixed nav including safe area */
    .build-outer {
      padding-top: calc(48px + env(safe-area-inset-top, 0px));
    }
    /* Sticky hero: sits flush under fixed nav */
    .build-hero-sticky {
      top: calc(48px + env(safe-area-inset-top, 0px));
    }
    /* Results table: progressive column hiding on narrow screens */
    @media (max-width: 760px) {
      .col-friction { display: none; }
    }
    @media (max-width: 620px) {
      .col-type { display: none; }
    }
    @media (max-width: 440px) {
      .col-time { display: none; }
      .col-owner { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
