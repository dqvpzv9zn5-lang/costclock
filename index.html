<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CostClock — Free Process Cost Calculator | Workthru</title>
  <meta name="description" content="Map any business process step by step and see the true fully-loaded cost. Free process cost calculator for accounting firms, legal practices, and SMEs. By Workthru.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      font-size: 16px;
      scroll-behavior: smooth;
      /* Suppress pull-to-refresh on mobile browsers without blocking horizontal
         scroll-snap gestures on child elements (those use touch-action: pan-x) */
      overscroll-behavior-y: contain;
    }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: #efefef;
      color: #1a1f2e;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }
    #root { min-height: 100vh; }
    @media (max-width: 900px) {
      .template-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 768px) {
      .hero-grid { grid-template-columns: 1fr !important; gap: 32px !important; }
    }
    @media (max-width: 580px) {
      .template-grid { grid-template-columns: 1fr !important; }
    }
    .badge-short { display: none; }
    @media (max-width: 480px) {
      .badge-full { display: none; }
      .badge-short { display: inline; }
      .template-grid { grid-template-columns: 1fr !important; }
    }
    /* Responsive page padding */
    @media (max-width: 600px) {
      .page-pad { padding-left: 16px !important; padding-right: 16px !important; }
    }
    /* Hide scrollbar on horizontal step row */
    .step-scroll-row::-webkit-scrollbar { display: none; }
    /* Allow horizontal pan gestures on scroll-snap rows without interfering
       with the page's vertical scroll or pull-to-refresh suppression */
    .step-scroll-row { touch-action: pan-x; }
    /* Editable field affordance — hover/focus reveals input styling */
    .editable-field {
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      transition: background 0.15s ease, border-color 0.15s ease, padding 0.15s ease;
      padding: 2px 4px;
      margin: -2px -4px;
      outline: none;
    }
    .editable-field:hover, .editable-field:focus {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
      padding: 2px 4px;
    }
    /* On dark backgrounds (hero panel) — same as above, already white-tinted */
    /* On light backgrounds (role cards) — use a light-mode tint */
    .editable-field-light {
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      transition: background 0.15s ease, border-color 0.15s ease;
      padding: 2px 4px;
      margin: -2px -4px;
      outline: none;
    }
    .editable-field-light:hover, .editable-field-light:focus {
      background: rgba(0,0,0,0.05);
      border-color: #d1d5db;
    }
    /* Touch devices: show only a very faint hint — not a highlighted/selected look */
    @media (hover: none) {
      .editable-field {
        background: rgba(255,255,255,0.04);
        border-color: rgba(255,255,255,0.09);
        padding: 2px 4px;
      }
      .editable-field-light {
        background: rgba(0,0,0,0.02);
        border-color: rgba(0,0,0,0.06);
        padding: 2px 4px;
      }
    }
    /* Two-panel row: stack vertically on narrow screens */
    /* panel-row is always flex-row — no stacking breakpoint.
       Frequency panel (width:180) stays compact; roles panel takes the rest. */
    .panel-row { display: flex; gap: 12px; align-items: flex-start; }
    /* Safe-area / bottom-bar clearance on mobile.
       The fixed action bar is ~56px; add extra for iOS home indicator. */
    .build-content-pad {
      padding-bottom: calc(140px + env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Fixed bottom bar: respect iOS home indicator */
    .bottom-action-bar {
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    }
    /* Fixed nav: add top safe area (notch/Dynamic Island) */
    .app-nav {
      padding-top: env(safe-area-inset-top, 0px);
    }
    /* BuildScreen outer: clear fixed nav including safe area */
    .build-outer {
      padding-top: calc(48px + env(safe-area-inset-top, 0px));
    }
    /* Sticky hero: sits flush under fixed nav */
    .build-hero-sticky {
      top: calc(48px + env(safe-area-inset-top, 0px));
    }
    /* ── Scroll rows: full-bleed with inset snap on mobile ──
       Negative margins extend the scroll container to the viewport edges so
       cards scroll into the visible screen gutter. padding-left + scroll-padding-left
       set the snap position at the content inset (16px), so the leftmost card
       aligns with the Team roles panel and other content above/below.
       Cards bleed to the right screen edge; snap aligns to content column. */
    @media (max-width: 600px) {
      .card-scroll-row {
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        scroll-padding-left: 16px;
      }
    }

    /* ── Roles card: full-width when expanded ──
       Freq card hides via React (display:none) so roles card fills the full
       panel-row width via flex:1 — left edge stays aligned with content,
       right edge covers where the freq panel was. No extra CSS needed. */

    /* ── iOS zoom prevention (mobile only) ──
       iOS Safari zooms in on focus when input font-size < 16px.
       Scoped to mobile only so desktop select/input sizes are unaffected. */
    @media (max-width: 600px) {
      /* Native <select> elements open a picker, not a keyboard, so they don't
         trigger iOS auto-zoom. Only text inputs and textareas need the 1rem floor. */
      input, textarea { font-size: 1rem !important; }
    }

    /* ── Hero panel detail chips: collapse on mobile ── */
    /* On desktop the chips row is always visible (display:flex set inline). */
    /* On mobile, hide by default; show when .open is added by React state. */
    .hero-chips-toggle { display: none; }
    @media (max-width: 600px) {
      .hero-chips { display: none !important; }
      .hero-chips.open { display: flex !important; }
      .hero-chips-toggle { display: flex; align-items: center; gap: 4px;
        background: none; border: none; cursor: pointer;
        font-size: 0.72rem; color: rgba(255,255,255,0.45); font-family: 'DM Sans',sans-serif;
        padding: 8px 20px 14px; width: 100%; }
    }

    /* ── Roles collapsed label: hide rate chips on mobile ── */
    @media (max-width: 600px) { .roles-preview-chips { display: none !important; } }

    /* Results table: progressive column hiding on narrow screens */
    @media (max-width: 760px) {
      .col-friction { display: none; }
    }
    @media (max-width: 620px) {
      .col-type { display: none; }
    }
    @media (max-width: 440px) {
      .col-time { display: none; }
      .col-owner { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
